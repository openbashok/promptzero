# Dependabot keeps third-party action SHAs (in .github/workflows/) and
# Python deps (requirements.txt) under review. PRs land monthly so we
# don't spam main with daily bumps for every transitive update.
#
# Vulnerability alerts + automated security fixes are enabled at the
# repo level, so anything CVE-tagged still gets a fast PR regardless
# of the cadence configured here.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(actions)

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
