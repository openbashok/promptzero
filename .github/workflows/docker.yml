name: Publish Docker image

# Builds the PromptZero proxy image and pushes it to GitHub Container
# Registry (ghcr.io) so end users can just:
#
#   docker run -p 8000:8000 -e ANTHROPIC_API_KEY=... \
#     ghcr.io/openbashok/promptzero:latest
#
# Triggers:
#   • push to main          → publishes :latest
#   • git tag v*.*.*        → publishes :latest + :<version> + :<major.minor>
#   • manual dispatch       → publishes :latest (for ad-hoc rebuilds)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "main.py"
      - "sanitizer.py"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # openbashok/promptzero

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=PromptZero
            org.opencontainers.image.description=Zero Trust proxy for the Claude API — sanitizes sensitive data before it reaches the model
            org.opencontainers.image.vendor=OpenBash
            org.opencontainers.image.licenses=MIT

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SPACY_SIZE=lg
